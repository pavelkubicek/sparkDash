<!DOCTYPE html>
<html lang="en" data-theme="dark" data-density="compact">
<head>
  <meta charset="UTF-8" />
  <script>
    // Apply the saved theme before first paint (every page, including the standalone Showcase window).
    try {
      var t = localStorage.getItem("sparkdash-theme");
      if (t === "white" || t === "light" || t === "dark" || t === "oled") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
    // "Desktop site" on a phone: the browser ignores the viewport meta and lays
    // the page out at ~980px. Only there (touch input + phone-sized screen +
    // wide viewport) does the 1200px desktop floor apply (html.desktop-viewport
    // in index.css); a normal mobile viewport adapts. Re-checked on rotate.
    var setDesktopViewport = function () {
      document.documentElement.classList.toggle(
        "desktop-viewport",
        navigator.maxTouchPoints > 0 &&
          Math.min(screen.width, screen.height) <= 600 &&
          window.innerWidth >= 960
      );
    };
    setDesktopViewport();
    window.addEventListener("resize", setDesktopViewport);
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0c0f" />
  <!-- PWA: installable on mobile home screen -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="sparkDash" />
  <title>sparkDash — Multi-DGX Spark Monitoring Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e8a830' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M13 2L3 14h9l-1 8 10-12h-9l1-8z'/></svg>" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
